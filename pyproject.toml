[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-mcp"
version = "0.1.0"
description = "Give Claude instant knowledge of your codebase — local, private, no cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NR", email = "nrkoka@gmail.com" }]
keywords = ["mcp", "claude", "ai", "context", "codebase", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "fastmcp>=2.0.0",
    "lancedb>=0.8.0",
    "sentence-transformers>=3.0.0",
    "watchdog>=4.0.0",
    "tomli-w>=1.0.0",
    "rich>=13.0.0",
    "pyarrow>=14.0.0",
    "openai>=1.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
synapse = "synapse.cli:main"
synapse-mcp = "synapse.mcp.server:run"

[project.urls]
Homepage = "https://github.com/nrkoka786/synapse"
Repository = "https://github.com/nrkoka786/synapse"
Issues = "https://github.com/nrkoka786/synapse/issues"

[tool.hatch.build.targets.wheel]
packages = ["synapse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
